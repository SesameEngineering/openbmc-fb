#@TYPE: Machine
#@NAME: Lightning
#@DESCRIPTION: Machine configuration for Facebook Lightning

UBOOT_MACHINE:lightning = "fblightning_config"

require conf/machine/include/ast1250.inc

PREFERRED_VERSION_u-boot = "v2016.07%"
PREFERRED_VERSION_u-boot-mkimage = "v2016.07%"
PREFERRED_VERSION_u-boot-fw-utils = "v2016.07%"

# The trailing % is required: linux-aspeed_4.1.bb's PV is "4.1.51+gitAUTOINC+<sha>",
# which an unwildcarded "4.1.51" never matches. Without it bitbake silently
# discards the preference and builds the newest kernel it can find (6.12.9),
# which is ARMv7 and cannot execute on this machine's ARMv5 ARM926EJ-S.
PREFERRED_VERSION_linux-aspeed = "4.1.51%"
PREFERRED_VERSION_fscd = "0.3"
PREFERRED_VERSION_openbmc-gpio = "0.2"
KERNEL_IMAGETYPE = "zImage"
PREFERRED_VERSION_rest-api = "0.2"
PREFERRED_VERSION_libwatchdog = "0.1"
PREFERRED_VERSION_switchtec-user = "1.0"

require conf/machine/include/fb-compute.inc
